<!doctype html>
<html lang="ja" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Text Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Crimson+Pro:wght@600;700&amp;display=swap" rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    .editor-container {
      background: linear-gradient(135deg, #1a0000 0%, #2d0a0a 50%, #470d0d 100%);
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .text-editor {
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.9;
      caret-color: #dc2626;
    }
    
    .text-editor:focus {
      outline: none;
    }
    
    .text-editor::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    .tool-btn {
      transition: all 0.2s ease;
    }
    
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }
    
    .tool-btn.active {
      background: rgba(220, 38, 38, 0.3);
      color: #dc2626;
    }
    
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    
    .character-grid::-webkit-scrollbar {
      width: 6px;
    }
    
    .character-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    .character-grid::-webkit-scrollbar-thumb {
      background: rgba(220, 38, 38, 0.5);
      border-radius: 3px;
    }
    
    .char-btn {
      transition: all 0.2s ease;
      font-size: 1.25rem;
    }
    
    .char-btn:hover {
      background: rgba(220, 38, 38, 0.3);
      transform: scale(1.1);
    }
    
    .category-btn.active {
      background: rgba(220, 38, 38, 0.5);
      color: #fff;
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .word-count {
      font-variant-numeric: tabular-nums;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0 p-0">
  <div class="editor-container h-full w-full overflow-auto">
   <div class="min-h-full w-full p-4 md:p-8">
    <div class="max-w-4xl mx-auto"><!-- Header -->
     <header class="text-center mb-8 fade-in">
      <div class="mb-6 flex justify-center gap-3" dir="ltr">
       <a href="/editors.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-white/90 bg-white/10 hover:bg-white/20 text-sm font-medium transition-all border border-white/10">← Torna agli Editor</a>
       <a href="/index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-white/90 bg-white/10 hover:bg-white/20 text-sm font-medium transition-all border border-white/10">🏠 Home</a>
      </div>
      <h1 id="editor-title" class="text-3xl md:text-4xl font-semibold text-white mb-2" style="font-family: 'Crimson Pro', serif;">Japanese Text Editor</h1>
      <p class="text-gray-400 text-sm">Write beautifully in Japanese - 日本語で美しく書く</p>
     </header><!-- Language Display -->
     <div class="flex justify-center mb-6 fade-in" style="animation-delay: 0.1s;">
      <div class="px-6 py-3 rounded-xl text-white font-medium text-base flex items-center gap-3" style="background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);"><span class="text-2xl">🇯🇵</span> <span>日本語 Japanese</span>
      </div>
     </div><!-- Main Editor Panel -->
     <div class="glass-panel rounded-2xl overflow-hidden fade-in" style="animation-delay: 0.2s;"><!-- Toolbar -->
      <div class="flex items-center gap-1 p-3 border-b border-white/10 flex-wrap"><button class="tool-btn p-2 rounded-lg text-white/70" onclick="formatText('bold')" title="Bold" aria-label="Bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z"></path> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="formatText('italic')" title="Italic" aria-label="Italic">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 4h4m-2 0v16m-4 0h8"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="formatText('underline')" title="Underline" aria-label="Underline">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 5v7a5 5 0 0010 0V5M5 19h14"></path>
        </svg></button>
       <div class="w-px h-6 bg-white/20 mx-2"></div><button class="tool-btn p-2 rounded-lg text-white/70" onclick="changeFontSize('increase')" title="Increase Size" aria-label="Increase font size">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m6-6H6"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="changeFontSize('decrease')" title="Decrease Size" aria-label="Decrease font size">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H6"></path>
        </svg></button>
       <div class="w-px h-6 bg-white/20 mx-2"></div><button class="tool-btn p-2 rounded-lg text-white/70" onclick="clearEditor()" title="Clear" aria-label="Clear text">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="copyText()" title="Copy" aria-label="Copy text">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="exportText()" title="Export as TXT" aria-label="Export text file">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg></button>
       <div class="ml-auto flex items-center gap-2"><span id="word-count" class="word-count text-xs text-white/50 px-3 py-1 bg-white/5 rounded-full">0 chars</span>
       </div>
      </div><!-- Text Area -->
      <div class="p-4">
       <div id="text-editor" class="text-editor w-full min-h-[250px] bg-transparent text-white text-lg resize-none" contenteditable="true" role="textbox" aria-label="Japanese text editor" data-placeholder="ここに入力してください..."></div>
      </div>
     </div><!-- Character Palette -->
     <div class="glass-panel rounded-2xl mt-6 p-4 fade-in" style="animation-delay: 0.3s;">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
       <h3 id="palette-title" class="text-white font-medium">Japanese Characters - 日本語の文字</h3>
       <div class="flex gap-2 flex-wrap"><button class="category-btn active text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('hiragana')">Hiragana</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('katakana')">Katakana</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('kanji')">Kanji</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('punctuation')">Punctuation</button>
       </div>
      </div>
      <div id="character-palette" class="character-grid"><!-- Characters will be populated by JavaScript -->
      </div>
     </div><!-- Quick Phrases -->
     <div class="glass-panel rounded-2xl mt-6 p-4 fade-in" style="animation-delay: 0.4s;">
      <h3 class="text-white font-medium mb-3">Quick Phrases - よく使う表現</h3>
      <div id="quick-phrases" class="flex flex-wrap gap-2"><!-- Phrases will be populated by JavaScript -->
      </div>
     </div>
    </div>
   </div>
  </div><!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white px-4 py-2 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 text-sm">
   Copied to clipboard!
  </div>
  <script>
    // Default configuration
    const defaultConfig = {
      editor_title: 'Japanese Text Editor',
      placeholder_text: 'Start typing here...',
      background_color: '#1a0000',
      surface_color: 'rgba(255, 255, 255, 0.04)',
      text_color: '#ffffff',
      primary_action: '#dc2626',
      secondary_action: '#991b1b',
      font_family: 'Crimson Pro',
      font_size: 16
    };

    let config = { ...defaultConfig };
    let currentFontSize = 18;
    let currentCategory = 'hiragana';

    // Japanese character data
    const japaneseData = {
      hiragana: [
        '\u3042', '\u3044', '\u3046', '\u3048', '\u304A',
        '\u304B', '\u304D', '\u304F', '\u3051', '\u3053',
        '\u3055', '\u3057', '\u3059', '\u305B', '\u305D',
        '\u305F', '\u3061', '\u3064', '\u3066', '\u3068',
        '\u306A', '\u306B', '\u306C', '\u306D', '\u306E',
        '\u306F', '\u3072', '\u3075', '\u3078', '\u307B',
        '\u307E', '\u307F', '\u3080', '\u3081', '\u3082',
        '\u3084', '\u3086', '\u3088',
        '\u3089', '\u308A', '\u308B', '\u308C', '\u308D',
        '\u308F', '\u3092', '\u3093',
        '\u304C', '\u304E', '\u3050', '\u3052', '\u3054',
        '\u3056', '\u3058', '\u305A', '\u305C', '\u305E',
        '\u3060', '\u3062', '\u3065', '\u3067', '\u3069',
        '\u3070', '\u3073', '\u3076', '\u3079', '\u307C',
        '\u3071', '\u3074', '\u3077', '\u307A', '\u307D'
      ],
      katakana: [
        '\u30A2', '\u30A4', '\u30A6', '\u30A8', '\u30AA',
        '\u30AB', '\u30AD', '\u30AF', '\u30B1', '\u30B3',
        '\u30B5', '\u30B7', '\u30B9', '\u30BB', '\u30BD',
        '\u30BF', '\u30C1', '\u30C4', '\u30C6', '\u30C8',
        '\u30CA', '\u30CB', '\u30CC', '\u30CD', '\u30CE',
        '\u30CF', '\u30D2', '\u30D5', '\u30D8', '\u30DB',
        '\u30DE', '\u30DF', '\u30E0', '\u30E1', '\u30E2',
        '\u30E4', '\u30E6', '\u30E8',
        '\u30E9', '\u30EA', '\u30EB', '\u30EC', '\u30ED',
        '\u30EF', '\u30F2', '\u30F3',
        '\u30AC', '\u30AE', '\u30B0', '\u30B2', '\u30B4',
        '\u30B6', '\u30B8', '\u30BA', '\u30BC', '\u30BE',
        '\u30C0', '\u30C2', '\u30C5', '\u30C7', '\u30C9',
        '\u30D0', '\u30D3', '\u30D6', '\u30D9', '\u30DC',
        '\u30D1', '\u30D4', '\u30D7', '\u30DA', '\u30DD'
      ],
      kanji: [
        '\u65E5', '\u6708', '\u706B', '\u6C34', '\u6728', '\u91D1', '\u571F',
        '\u4E00', '\u4E8C', '\u4E09', '\u56DB', '\u4E94', '\u516D', '\u4E03', '\u516B', '\u4E5D', '\u5341',
        '\u4EBA', '\u5973', '\u7537', '\u5B50', '\u6BCD', '\u7236',
        '\u5C71', '\u5DDD', '\u7530', '\u6797', '\u6751', '\u753A',
        '\u5927', '\u5C0F', '\u4E2D', '\u4E0A', '\u4E0B',
        '\u5929', '\u5730', '\u96E8', '\u96EA', '\u98A8',
        '\u767D', '\u9ED1', '\u8D64', '\u9752', '\u9EC4',
        '\u5317', '\u5357', '\u6771', '\u897F',
        '\u5DE6', '\u53F3', '\u524D', '\u5F8C',
        '\u65B0', '\u53E4', '\u9577', '\u77ED',
        '\u660E', '\u6697', '\u9AD8', '\u4F4E',
        '\u597D', '\u60AA', '\u591A', '\u5C11',
        '\u82B1', '\u8349', '\u6728', '\u8449'
      ],
      punctuation: ['\u3002', '\u3001', '\uFF01', '\uFF1F', '\u300C', '\u300D', '\u300E', '\u300F', '\u30FB', '\u2026', '\uFF5E', '\u2015', '\uFF1A', '\uFF1B', '\uFF0C', '\uFF0E'],
      phrases: [
        '\u3053\u3093\u306B\u3061\u306F',
        '\u3042\u308A\u304C\u3068\u3046',
        '\u3055\u3088\u3046\u306A\u3089',
        '\u304A\u306F\u3088\u3046',
        '\u304A\u3084\u3059\u307F',
        '\u3059\u307F\u307E\u305B\u3093',
        '\u3069\u3046\u305E\u3088\u308D\u3057\u304F',
        '\u304A\u540D\u524D\u306F\uFF1F',
        '\u5143\u6C17\u3067\u3059\u304B\uFF1F',
        '\u304A\u4E45\u3057\u3076\u308A',
        '\u307E\u305F\u306D',
        '\u304A\u3081\u3067\u3068\u3046',
        '\u304C\u3093\u3070\u3063\u3066',
        '\u3044\u3044\u5929\u6C17',
        '\u304A\u3044\u3057\u3044',
        '\u4ECA\u65E5',
        '\u660E\u65E5',
        '\u6628\u65E5'
      ]
    };

    // Initialize
    function init() {
      showCategory('hiragana');
      updateQuickPhrases();
      setupEditor();
    }

    function showCategory(category) {
      currentCategory = category;
      const palette = document.getElementById('character-palette');
      let chars = japaneseData[category] || [];
      
      // Update active button
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Find and activate the clicked button
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach(btn => {
        if (btn.textContent.toLowerCase().includes(category.toLowerCase())) {
          btn.classList.add('active');
        }
      });
      
      palette.innerHTML = chars.map(char => `
        <button class="char-btn glass-panel w-12 h-12 rounded-xl text-white flex items-center justify-center hover:text-red-400" onclick="insertCharacter('${char}')" aria-label="Insert ${char}">
          ${char}
        </button>
      `).join('');
    }

    function updateQuickPhrases() {
      const container = document.getElementById('quick-phrases');
      const phrases = japaneseData.phrases;
      
      container.innerHTML = phrases.map(phrase => `
        <button class="px-4 py-2 rounded-xl glass-panel text-white/80 text-sm hover:bg-white/10 transition-all" onclick="insertPhrase('${phrase}')">
          ${phrase}
        </button>
      `).join('');
    }

    function setupEditor() {
      const editor = document.getElementById('text-editor');
      
      editor.addEventListener('input', function() {
        updateWordCount();
      });
      
      updatePlaceholder();
    }

    function updatePlaceholder() {
      const editor = document.getElementById('text-editor');
      if (editor.textContent === '') {
        editor.innerHTML = '';
      }
    }

    function insertCharacter(char) {
      const editor = document.getElementById('text-editor');
      editor.focus();
      document.execCommand('insertText', false, char);
      updateWordCount();
    }

    function insertPhrase(phrase) {
      const editor = document.getElementById('text-editor');
      editor.focus();
      document.execCommand('insertText', false, phrase);
      updateWordCount();
    }

    function formatText(command) {
      document.execCommand(command, false, null);
    }

    function changeFontSize(direction) {
      const editor = document.getElementById('text-editor');
      if (direction === 'increase') {
        currentFontSize = Math.min(currentFontSize + 2, 36);
      } else {
        currentFontSize = Math.max(currentFontSize - 2, 12);
      }
      editor.style.fontSize = currentFontSize + 'px';
    }

    function clearEditor() {
      const editor = document.getElementById('text-editor');
      editor.innerHTML = '';
      updateWordCount();
    }

    function copyText() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      
      if (!text || text.trim() === '') {
        showToast('No text to copy');
        return;
      }
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Copied to clipboard!');
        }).catch((err) => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    
    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast('Copied to clipboard!');
        } else {
          showToast('Copy failed');
        }
      } catch (err) {
        showToast('Copy failed');
      }
      
      document.body.removeChild(textarea);
    }

    function exportText() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      
      if (!text || text.trim() === '') {
        showToast('No text to export');
        return;
      }
      
      // Add UTF-8 BOM to ensure proper encoding
      const BOM = '\uFEFF';
      const textWithBOM = BOM + text;
      
      const blob = new Blob([textWithBOM], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      
      const date = new Date();
      const filename = `japanese-text-${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}.txt`;
      link.download = filename;
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      showToast('Text exported!');
    }

    function updateWordCount() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      const count = text.length;
      document.getElementById('word-count').textContent = `${count} chars`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2000);
    }

    // Element SDK Integration
    async function onConfigChange(cfg) {
      config = { ...defaultConfig, ...cfg };
      
      const title = document.getElementById('editor-title');
      title.textContent = config.editor_title || defaultConfig.editor_title;
      title.style.fontFamily = `${config.font_family || defaultConfig.font_family}, serif`;
      
      const baseSize = config.font_size || defaultConfig.font_size;
      title.style.fontSize = `${baseSize * 2}px`;
      
      const editor = document.getElementById('text-editor');
      editor.setAttribute('data-placeholder', config.placeholder_text || defaultConfig.placeholder_text);
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [
          {
            get: () => cfg.background_color || defaultConfig.background_color,
            set: (value) => { cfg.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => cfg.surface_color || defaultConfig.surface_color,
            set: (value) => { cfg.surface_color = value; window.elementSdk.setConfig({ surface_color: value }); }
          },
          {
            get: () => cfg.text_color || defaultConfig.text_color,
            set: (value) => { cfg.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => cfg.primary_action || defaultConfig.primary_action,
            set: (value) => { cfg.primary_action = value; window.elementSdk.setConfig({ primary_action: value }); }
          },
          {
            get: () => cfg.secondary_action || defaultConfig.secondary_action,
            set: (value) => { cfg.secondary_action = value; window.elementSdk.setConfig({ secondary_action: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => cfg.font_family || defaultConfig.font_family,
          set: (value) => { cfg.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => cfg.font_size || defaultConfig.font_size,
          set: (value) => { cfg.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map([
        ['editor_title', cfg.editor_title || defaultConfig.editor_title],
        ['placeholder_text', cfg.placeholder_text || defaultConfig.placeholder_text]
      ]);
    }

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    // Start the app
