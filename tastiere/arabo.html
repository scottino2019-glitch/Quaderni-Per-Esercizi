<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic Text Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Spectral:wght@600;700&amp;display=swap" rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    .editor-container {
      background: linear-gradient(135deg, #0a1929 0%, #1a2942 50%, #0f2744 100%);
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .text-editor {
      font-family: 'Amiri', serif;
      line-height: 2;
      caret-color: #d4af37;
      direction: rtl;
      text-align: right;
    }
    
    .text-editor:focus {
      outline: none;
    }
    
    .text-editor::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    .tool-btn {
      transition: all 0.2s ease;
    }
    
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }
    
    .tool-btn.active {
      background: rgba(212, 175, 55, 0.3);
      color: #d4af37;
    }
    
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    
    .character-grid::-webkit-scrollbar {
      width: 6px;
    }
    
    .character-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    .character-grid::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.5);
      border-radius: 3px;
    }
    
    .char-btn {
      transition: all 0.2s ease;
      font-size: 1.5rem;
      font-family: 'Amiri', serif;
    }
    
    .char-btn:hover {
      background: rgba(212, 175, 55, 0.3);
      transform: scale(1.1);
    }
    
    .category-btn.active {
      background: rgba(212, 175, 55, 0.5);
      color: #fff;
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .word-count {
      font-variant-numeric: tabular-nums;
    }
    
    .arabic-text {
      font-family: 'Amiri', serif;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0 p-0">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg></button> <button class="tool-btn p-2 rounded-lg text-white/70" onclick="exportText()" title="Export as TXT" aria-label="Export text file">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg></button>
       <div class="ml-auto flex items-center gap-2"><span id="word-count" class="word-count text-xs text-white/50 px-3 py-1 bg-white/5 rounded-full">0 chars</span>

      </div><!-- Text Area -->
      <div class="p-4">
       <div id="text-editor" class="text-editor w-full min-h-[250px] bg-transparent text-white text-lg resize-none" contenteditable="true" role="textbox" aria-label="Arabic text editor" data-placeholder="اكتب هنا..."></div>
      </div>
     </div><!-- Character Palette -->
     <div class="glass-panel rounded-2xl mt-6 p-4 fade-in" style="animation-delay: 0.3s;">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
       <h3 id="palette-title" class="text-white font-medium arabic-text">الحروف العربية - Arabic Characters</h3>
       <div class="flex gap-2 flex-wrap"><button class="category-btn active text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('letters')">Letters</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('diacritics')">Diacritics</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('numbers')">Numbers</button> <button class="category-btn text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/70 hover:bg-white/20 transition-all" onclick="showCategory('punctuation')">Punctuation</button>
       </div>
      </div>
      <div id="character-palette" class="character-grid"><!-- Characters will be populated by JavaScript -->
      </div>
     </div><!-- Quick Phrases -->
     <div class="glass-panel rounded-2xl mt-6 p-4 fade-in" style="animation-delay: 0.4s;">
      <h3 class="text-white font-medium mb-3 arabic-text">عبارات شائعة - Quick Phrases</h3>
      <div id="quick-phrases" class="flex flex-wrap gap-2"><!-- Phrases will be populated by JavaScript -->
      </div>
     </div>
    </div>
   </div>
  </div><!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-gradient-to-r from-green-500 to-emerald-500 text-white px-4 py-2 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 text-sm">
   Copied to clipboard!
  </div>
  <script>
    // Default configuration
    const defaultConfig = {
      editor_title: 'Arabic Text Editor',
      placeholder_text: 'Start typing here...',
      background_color: '#0a1929',
      surface_color: 'rgba(255, 255, 255, 0.04)',
      text_color: '#ffffff',
      primary_action: '#d4af37',
      secondary_action: '#aa8a2e',
      font_family: 'Spectral',
      font_size: 16
    };

    let config = { ...defaultConfig };
    let currentFontSize = 20;
    let currentCategory = 'letters';

    // Arabic character data
    const arabicData = {
      letters: [
        '\u0627', '\u0628', '\u062A', '\u062B', '\u062C', '\u062D', '\u062E',
        '\u062F', '\u0630', '\u0631', '\u0632', '\u0633', '\u0634', '\u0635',
        '\u0636', '\u0637', '\u0638', '\u0639', '\u063A', '\u0641', '\u0642',
        '\u0643', '\u0644', '\u0645', '\u0646', '\u0647', '\u0648', '\u064A',
        '\u0622', '\u0629', '\u0649', '\u0626', '\u0624', '\u0621', '\u0625', '\u0623'
      ],
      diacritics: [
        '\u064B', '\u064C', '\u064D', '\u064E', '\u064F', '\u0650',
        '\u0651', '\u0652', '\u0653', '\u0654', '\u0655', '\u0656'
      ],
      numbers: [
        '\u0660', '\u0661', '\u0662', '\u0663', '\u0664',
        '\u0665', '\u0666', '\u0667', '\u0668', '\u0669'
      ],
      punctuation: [
        '\u060C', '\u061B', '\u061F', '\u066A', '\u066B', '\u066C',
        '\u066D', '\u06D4', '\u002E', '\u002C', '\u003A', '\u003B',
        '\u0021', '\u003F', '\u002D', '\u2014'
      ],
      phrases: [
        '\u0627\u0644\u0633\u0644\u0627\u0645 \u0639\u0644\u064A\u0643\u0645',
        '\u0645\u0631\u062D\u0628\u0627\u064B',
        '\u0634\u0643\u0631\u0627\u064B',
        '\u0645\u0639 \u0627\u0644\u0633\u0644\u0627\u0645\u0629',
        '\u0635\u0628\u0627\u062D \u0627\u0644\u062E\u064A\u0631',
        '\u0645\u0633\u0627\u0621 \u0627\u0644\u062E\u064A\u0631',
        '\u062A\u0635\u0628\u062D \u0639\u0644\u0649 \u062E\u064A\u0631',
        '\u0643\u064A\u0641 \u062D\u0627\u0644\u0643\u061F',
        '\u0645\u0627 \u0627\u0633\u0645\u0643\u061F',
        '\u0645\u0646 \u0641\u0636\u0644\u0643',
        '\u0639\u0641\u0648\u0627\u064B',
        '\u0628\u0627\u0644\u062A\u0648\u0641\u064A\u0642',
        '\u0645\u0628\u0631\u0648\u0643',
        '\u0625\u0644\u0649 \u0627\u0644\u0644\u0642\u0627\u0621',
        '\u0627\u0644\u064A\u0648\u0645',
        '\u063A\u062F\u0627\u064B',
        '\u0623\u0645\u0633',
        '\u0627\u0644\u0622\u0646'
      ]
    };

    // Initialize
    function init() {
      showCategory('letters');
      updateQuickPhrases();
      setupEditor();
    }

    function showCategory(category) {
      currentCategory = category;
      const palette = document.getElementById('character-palette');
      let chars = arabicData[category] || [];
      
      // Update active button
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      // Find and activate the clicked button
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach(btn => {
        if (btn.textContent.toLowerCase().includes(category.toLowerCase())) {
          btn.classList.add('active');
        }
      });
      
      palette.innerHTML = chars.map(char => `
        <button class="char-btn glass-panel w-12 h-12 rounded-xl text-white flex items-center justify-center hover:text-yellow-400" onclick="insertCharacter('${char}')" aria-label="Insert ${char}">
          ${char}
        </button>
      `).join('');
    }

    function updateQuickPhrases() {
      const container = document.getElementById('quick-phrases');
      const phrases = arabicData.phrases;
      
      container.innerHTML = phrases.map(phrase => `
        <button class="px-4 py-2 rounded-xl glass-panel text-white/80 text-sm hover:bg-white/10 transition-all arabic-text" onclick="insertPhrase('${phrase}')">
          ${phrase}
        </button>
      `).join('');
    }

    function setupEditor() {
      const editor = document.getElementById('text-editor');
      
      editor.addEventListener('input', function() {
        updateWordCount();
      });
      
      updatePlaceholder();
    }

    function updatePlaceholder() {
      const editor = document.getElementById('text-editor');
      if (editor.textContent === '') {
        editor.innerHTML = '';
      }
    }

    function insertCharacter(char) {
      const editor = document.getElementById('text-editor');
      editor.focus();
      document.execCommand('insertText', false, char);
      updateWordCount();
    }

    function insertPhrase(phrase) {
      const editor = document.getElementById('text-editor');
      editor.focus();
      document.execCommand('insertText', false, phrase);
      updateWordCount();
    }

    function formatText(command) {
      document.execCommand(command, false, null);
    }

    function changeFontSize(direction) {
      const editor = document.getElementById('text-editor');
      if (direction === 'increase') {
        currentFontSize = Math.min(currentFontSize + 2, 38);
      } else {
        currentFontSize = Math.max(currentFontSize - 2, 14);
      }
      editor.style.fontSize = currentFontSize + 'px';
    }

    function clearEditor() {
      const editor = document.getElementById('text-editor');
      editor.innerHTML = '';
      updateWordCount();
    }

    function copyText() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      
      if (!text || text.trim() === '') {
        showToast('No text to copy');
        return;
      }
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Copied to clipboard!');
        }).catch((err) => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    
    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast('Copied to clipboard!');
        } else {
          showToast('Copy failed');
        }
      } catch (err) {
        showToast('Copy failed');
      }
      
      document.body.removeChild(textarea);
    }

    function exportText() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      
      if (!text || text.trim() === '') {
        showToast('No text to export');
        return;
      }
      
      // Add UTF-8 BOM to ensure proper encoding
      const BOM = '\uFEFF';
      const textWithBOM = BOM + text;
      
      const blob = new Blob([textWithBOM], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      
      const date = new Date();
      const filename = `arabic-text-${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}.txt`;
      link.download = filename;
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      showToast('Text exported!');
    }

    function updateWordCount() {
      const editor = document.getElementById('text-editor');
      const text = editor.textContent;
      const count = text.length;
      document.getElementById('word-count').textContent = `${count} chars`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2000);
    }

    // Element SDK Integration
    async function onConfigChange(cfg) {
      config = { ...defaultConfig, ...cfg };
      
      const title = document.getElementById('editor-title');
      title.textContent = config.editor_title || defaultConfig.editor_title;
      title.style.fontFamily = `${config.font_family || defaultConfig.font_family}, serif`;
      
      const baseSize = config.font_size || defaultConfig.font_size;
      title.style.fontSize = `${baseSize * 2}px`;
      
      const editor = document.getElementById('text-editor');
      editor.setAttribute('data-placeholder', config.placeholder_text || defaultConfig.placeholder_text);
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [
          {
            get: () => cfg.background_color || defaultConfig.background_color,
            set: (value) => { cfg.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => cfg.surface_color || defaultConfig.surface_color,
            set: (value) => { cfg.surface_color = value; window.elementSdk.setConfig({ surface_color: value }); }
          },
          {
            get: () => cfg.text_color || defaultConfig.text_color,
            set: (value) => { cfg.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => cfg.primary_action || defaultConfig.primary_action,
            set: (value) => { cfg.primary_action = value; window.elementSdk.setConfig({ primary_action: value }); }
          },
          {
            get: () => cfg.secondary_action || defaultConfig.secondary_action,
            set: (value) => { cfg.secondary_action = value; window.elementSdk.setConfig({ secondary_action: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => cfg.font_family || defaultConfig.font_family,
          set: (value) => { cfg.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => cfg.font_size || defaultConfig.font_size,
          set: (value) => { cfg.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map([
        ['editor_title', cfg.editor_title || defaultConfig.editor_title],
        ['placeholder_text', cfg.placeholder_text || defaultConfig.placeholder_text]
      ]);
    }

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    // Start the app
    init();
  </script>
